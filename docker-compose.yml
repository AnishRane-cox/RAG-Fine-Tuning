version: "3.9"

services:
  embedding-service:
    build: ./services/embedding_service
    container_name: embedding_service
    env_file:
      - ./services/embedding_service/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  model-service:
    build: ./services/model_service
    container_name: model_service
    environment:
      - BASE_MODEL=distilgpt2
      - ADAPTER_PATH=/app/adapters/lora_adapter
    volumes:
      - ./adapters:/app/adapters
    ports:
      - "5000:5000"
    restart: unless-stopped

  orchestrator-service:
    build: ./services/orchestrator_service
    container_name: orchestrator_service
    env_file:
      - ./services/orchestrator_service/.env
    ports:
      - "3000:3000"
    depends_on:
      - embedding-service
      - model-service
    restart: unless-stopped

  rag-demo:
    build: ./rag-demo
    container_name: rag_demo
    ports:
      - "3001:3000"
    depends_on:
      - orchestrator-service
    restart: unless-stopped